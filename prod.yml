  event_log:
    svm_key: svm01
    name: FSxN01_SVM01_event_log
    junction_path: /event_log
    size_mb: 307200
    security_style: NTFS
    tiering_policy: ALL
    snaplock: false

  filestore:
    svm_key: svm01
    name: FSxN01_SVM01_filestore
    junction_path: /filestore
    size_mb: 512000
